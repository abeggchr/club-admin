name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint and format
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore backend.Tests/backend.Tests.csproj
      - name: Check formatting
        run: dotnet format backend.Tests/backend.Tests.csproj --verify-no-changes --no-restore
      - name: Test
        run: dotnet test backend.Tests/backend.Tests.csproj --no-restore
